services:

  web01:
    build:
      context: ./docker
      args:
        ANSIBLE_PUBLIC_KEY: ${ANSIBLE_PUBLIC_KEY}
    container_name: ansible-web01
    hostname: web01
    ports:
      - "2221:22"
      - "5001:5000"

  web02:
    build:
      context: ./docker
      args:
        ANSIBLE_PUBLIC_KEY: ${ANSIBLE_PUBLIC_KEY}
    container_name: ansible-web02
    hostname: web02
    ports:
      - "2222:22"
      - "5002:5000"

  db01:
    build:
      context: ./docker
      args:
        ANSIBLE_PUBLIC_KEY: ${ANSIBLE_PUBLIC_KEY}
    container_name: ansible-db01
    hostname: db01
    ports:
      - "2223:22"

  lb01:
    build:
      context: ./docker
      args:
        ANSIBLE_PUBLIC_KEY: ${ANSIBLE_PUBLIC_KEY}
    container_name: ansible-lb01
    hostname: lb01
    ports:
      - "2224:22"
      - "8080:80"

  prometheus:
    image: prom/prometheus:latest
    container_name: ansible-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      - alertmanager

  grafana:
    image: grafana/grafana:latest
    container_name: ansible-grafana
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

  alertmanager:
    image: prom/alertmanager:latest
    container_name: ansible-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - alertmanager_data:/alertmanager
    command:
      - "--config.file=/etc/alertmanager/alertmanager.yml"
      - "--storage.path=/alertmanager"

  loki:
    image: grafana/loki:latest
    container_name: ansible-loki
    ports:
      - "3100:3100"
    volumes:
      - loki_data:/loki
    command: -config.file=/etc/loki/local-config.yaml

  alloy:
    image: grafana/alloy:latest
    container_name: ansible-alloy
    volumes:
      - ./monitoring/alloy-config.alloy:/etc/alloy/config.alloy:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    command:
      - run
      - /etc/alloy/config.alloy
    depends_on:
      - loki

volumes:
  grafana_data:
  prometheus_data:
  alertmanager_data:
  loki_data:
