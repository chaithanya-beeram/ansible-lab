---
- name: Stop Nginx
  ansible.builtin.service:
    name: nginx
    state: stopped
    enabled: false
  become: true
  failed_when: false

- name: Remove Nginx
  ansible.builtin.apt:
    name: nginx
    state: absent
    purge: true
  become: true

- name: Install HAProxy
  ansible.builtin.apt:
    name: haproxy
    state: present
    update_cache: true
  become: true

- name: Configure HAProxy
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    owner: root
    group: root
    mode: "0644"
  become: true
  notify: Restart HAProxy

- name: Validate HAProxy configuration
  ansible.builtin.command:
    cmd: haproxy -c -f /etc/haproxy/haproxy.cfg
  become: true
  changed_when: false

- name: Ensure HAProxy is running
  ansible.builtin.service:
    name: haproxy
    state: started
    enabled: true
  become: true

- name: Verify load balancer health
  ansible.builtin.include_tasks: health.yml
