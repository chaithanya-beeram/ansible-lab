---
- name: Stop Nginx
  ansible.builtin.service:
    name: nginx
    state: stopped
    enabled: false
  become: true
  failed_when: false

- name: Remove Nginx
  ansible.builtin.apt:
    name: nginx
    state: absent
  become: true

- name: Install HAProxy and runtime tools
  ansible.builtin.apt:
    name:
      - haproxy
      - socat
    state: present
    update_cache: true
  become: true

- name: Ensure HAProxy runtime directory exists
  ansible.builtin.file:
    path: /run/haproxy
    state: directory
    owner: root
    group: haproxy
    mode: "0755"
  become: true

- name: Configure HAProxy
  ansible.builtin.template:
    src: haproxy.cfg.j2
    dest: /etc/haproxy/haproxy.cfg
    owner: root
    group: root
    mode: "0644"
  notify: Restart HAProxy
  become: true

- name: Ensure HAProxy is running
  ansible.builtin.service:
    name: haproxy
    state: started
    enabled: true
  become: true

- name: Flush HAProxy handlers
  ansible.builtin.meta: flush_handlers

- name: Validate HAProxy configuration
  ansible.builtin.command:
    cmd: haproxy -c -f /etc/haproxy/haproxy.cfg
  changed_when: false
  become: true

- name: Wait for HAProxy runtime socket
  ansible.builtin.wait_for:
    path: /run/haproxy/admin.sock
    state: present
    timeout: 10
  become: true

- name: Verify HAProxy runtime socket is responsive
  ansible.builtin.shell: |
    echo "show info" | socat unix-connect:/run/haproxy/admin.sock stdio
  register: haproxy_runtime
  changed_when: false
  retries: 5
  delay: 2
  until: haproxy_runtime.rc == 0
  become: true

- name: Verify load balancer health
  ansible.builtin.include_tasks: health.yml
