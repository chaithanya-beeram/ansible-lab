---
- name: Create application user
  ansible.builtin.user:
    name: appuser
    system: true
    shell: /bin/bash

- name: Create application directory
  ansible.builtin.file:
    path: /opt/taskapp
    state: directory
    owner: appuser
    group: appuser
    mode: "0755"

- name: Install common packages
  ansible.builtin.apt:
    name:
      - curl
      - git
      - python3
      - python3-pip
      - python3-venv
    state: present
    update_cache: true
