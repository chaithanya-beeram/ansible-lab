---
- name: Install MySQL server
  ansible.builtin.apt:
    name:
      - mysql-server
      - mysql-client
    state: present
    update_cache: true
  become: true

- name: Install Python MySQL dependency
  ansible.builtin.apt:
    name: python3-pymysql
    state: present
  become: true

- name: Configure MySQL network binding
  ansible.builtin.lineinfile:
    path: /etc/mysql/mysql.conf.d/mysqld.cnf
    regexp: '^bind-address'
    line: 'bind-address = 0.0.0.0'
  become: true

- name: Check if MySQL is running
  ansible.builtin.shell:
    cmd: "pgrep -x mysqld"
  register: mysql_process
  failed_when: false
  changed_when: false
  become: true

- name: Start MySQL
  ansible.builtin.shell:
    cmd: "/usr/sbin/mysqld --user=mysql --daemonize"
  when: mysql_process.rc != 0
  become: true
  changed_when: true

- name: Wait for MySQL socket
  ansible.builtin.wait_for:
    path: /var/run/mysqld/mysqld.sock
    state: present
    timeout: 30
  become: true

- name: Create application database
  community.mysql.mysql_db:
    name: taskdb
    state: present
    login_unix_socket: /var/run/mysqld/mysqld.sock
  become: true

- name: Create application database user
  community.mysql.mysql_user:
    name: taskuser
    password: "{{ db_password }}"
    priv: "taskdb.*:ALL"
    host: "%"
    state: present
    login_unix_socket: /var/run/mysqld/mysqld.sock
  become: true

- name: Create tasks table
  community.mysql.mysql_query:
    login_unix_socket: /var/run/mysqld/mysqld.sock
    login_db: taskdb
    query: |
      CREATE TABLE IF NOT EXISTS tasks (
        id INT AUTO_INCREMENT PRIMARY KEY,
        title VARCHAR(255) NOT NULL,
        completed BOOLEAN NOT NULL DEFAULT FALSE
      );
  become: true

- name: Verify database health
  ansible.builtin.include_tasks: health.yml
