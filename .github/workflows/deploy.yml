name: Ansible CD

on:
  workflow_run:
    workflows: ["Ansible CI"]
    types:
      - completed
    branches:
      - main

jobs:
  deploy:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: self-hosted

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install Ansible
        run: |
          python3 -m venv .venv
          .venv/bin/pip install ansible

      - name: Install Ansible collections
        run: |
          .venv/bin/ansible-galaxy collection install -r requirements.yml

      - name: Deploy infrastructure
        run: |
          .venv/bin/ansible-playbook playbooks/site.yml \
            --private-key ~/.ssh/ansible_lab_cd

      - name: Verify application health
        run: |
          curl --fail --retry 5 --retry-delay 2 http://localhost:8080/health

      - name: Verify tasks API
        run: |
          curl --fail --retry 5 --retry-delay 2 http://localhost:8080/api/tasks

