global:
  scrape_interval: 5s

rule_files:
  - /etc/prometheus/alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - "alertmanager:9093"

scrape_configs:
  - job_name: "web"
    metrics_path: /metrics
    static_configs:
      - targets:
          - "web01:5000"
          - "web02:5000"

  - job_name: "node"
    static_configs:
      - targets:
          - "web01:9100"
          - "web02:9100"
          - "db01:9100"
          - "lb01:9100"

