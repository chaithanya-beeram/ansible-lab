---
- name: Deploy application infrastructure
  hosts: all
  become: true

  roles:
    - common
    - node_exporter

- name: Configure database
  hosts: database
  become: true

  roles:
    - database

- name: Deploy web servers
  hosts: web
  become: true
  serial: 1

  roles:
    - application
    - nginx

  tasks:

    - name: Verify application health
      ansible.builtin.uri:
        url: "http://127.0.0.1:5000/health"
        status_code: 200
      register: health_check
      retries: 10
      delay: 3
      until: health_check.status == 200

    - name: Verify tasks API
      ansible.builtin.uri:
        url: "http://127.0.0.1:5000/api/tasks"
        status_code: 200
      register: api_check
      retries: 10
      delay: 3
      until: api_check.status == 200
- name: Configure load balancer
  hosts: loadbalancer
  become: true

  roles:
    - common
    - loadbalancer
