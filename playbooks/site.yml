---
- name: Deploy application infrastructure
  hosts: all
  become: true

  roles:
    - common
    - node_exporter


- name: Configure database
  hosts: database
  become: true

  roles:
    - database


- name: Configure load balancer
  hosts: loadbalancer
  become: true

  roles:
    - common
    - loadbalancer


- name: Rolling deploy web servers
  hosts: web
  become: true
  serial: 1

  pre_tasks:

    - name: Drain web server from HAProxy
      ansible.builtin.shell: |
        echo "set server web_backend/{{ inventory_hostname }} state drain" \
          | socat unix-connect:/run/haproxy/admin.sock stdio
      delegate_to: "{{ groups['loadbalancer'][0] }}"
      become: true
      changed_when: true

    - name: Wait for HAProxy to drain connections
      ansible.builtin.pause:
        seconds: 2


  tasks:

    - name: Deploy and validate web server
      block:

        - name: Deploy application
          ansible.builtin.include_role:
            name: application

        - name: Configure Nginx
          ansible.builtin.include_role:
            name: nginx

        - name: Verify web server through Nginx
          ansible.builtin.uri:
            url: "http://127.0.0.1/health"
            status_code: 200
          register: nginx_health
          retries: 10
          delay: 3
          until: nginx_health.status == 200

        - name: Verify tasks API through Nginx
          ansible.builtin.uri:
            url: "http://127.0.0.1/api/tasks"
            status_code: 200
          register: nginx_api
          retries: 10
          delay: 3
          until: nginx_api.status == 200


      always:

        - name: Verify web server is healthy before re-enabling
          ansible.builtin.uri:
            url: "http://127.0.0.1/health"
            status_code: 200
          register: final_health
          retries: 5
          delay: 3
          until: final_health.status == 200
          failed_when: false

        - name: Re-enable healthy web server in HAProxy
          ansible.builtin.shell: |
            echo "set server web_backend/{{ inventory_hostname }} state ready" \
              | socat unix-connect:/run/haproxy/admin.sock stdio
          delegate_to: "{{ groups['loadbalancer'][0] }}"
          become: true
          changed_when: true
          when: final_health.status | default(0) == 200

        - name: Fail deployment if web server is unhealthy
          ansible.builtin.fail:
            msg: >-
              {{ inventory_hostname }} failed final health validation.
              The server remains drained from HAProxy.
          when: final_health.status | default(0) != 200


    - name: Wait for HAProxy to recognize web server
      ansible.builtin.pause:
        seconds: 2
